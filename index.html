<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus timer and cup</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #fff;
      --surface: #f9f8f7;
      --ink: #203249;
      --muted: #647185;
      --line: #e1e8f0;
      --blue: #1766b5;
      --blue-soft: #eaf5ff;
      --track: #e7eff6;
      --green: #27704b;
    }
​
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--canvas);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 390px); margin: auto; display: grid; gap: 16px; }
    .card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(31, 56, 85, .035);
    }
    .top, .goal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .tag {
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--blue-soft);
      color: var(--muted);
      font-size: 14px;
    }
    .clock {
      background: linear-gradient(135deg, #182c45, #203e60);
      color: #fff;
      border-color: #2d4d70;
      box-shadow: none;
    }
    .clock h2 { color: #dceaf8; }
    .tabs { display: flex; gap: 4px; margin-top: 16px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--canvas);
      color: var(--ink);
      cursor: pointer;
      font: 600 14px/1.3 inherit;
      transition: background .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    button:hover { box-shadow: 0 2px 6px rgba(31,56,85,.1); }
    button:active { box-shadow: none; }
    button:focus-visible { outline: 3px solid #5e9fe8; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); }
    .tabs button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue); }
    .clock-display { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0; }
    .clock-display time { font-size: clamp(38px, 14vw, 54px); font-weight: 550; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .analog { width: 64px; height: 64px; flex: 0 0 64px; }
    .clock-foot { padding-top: 12px; border-top: 1px solid #48617c; color: #b8d0e9; font-size: 14px; }
    .status { min-height: 42px; margin: 0 0 16px; color: #c5d7ea; font-size: 14px; }
    .controls { display: flex; gap: 8px; }
    .controls button { flex: 1; }
    .primary { flex: 2 !important; background: var(--blue); border-color: var(--blue); color: #fff; }
    .dial { position: relative; width: 164px; height: 164px; margin: 16px auto 12px; }
    .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .track { stroke: var(--track); }
    .arc { stroke: url(#timer-gradient); stroke-linecap: round; }
    .dial-copy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .digits { font-size: 40px; font-weight: 550; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .mode { color: var(--muted); font-size: 14px; letter-spacing: .08em; }
    .goal-head strong { font-size: 32px; letter-spacing: -.04em; }
    .goal-head strong span { color: var(--muted); font-size: 14px; font-weight: 400; }
    .cup-row { display: flex; align-items: center; gap: 20px; margin: 16px 0; }
    .cup { width: 100px; flex: 0 0 100px; }
    .cup svg { display: block; width: 100%; height: auto; }
    .goal-note { margin: 0 0 8px; font-size: 16px; font-weight: 550; line-height: 1.45; }
    .hint { color: var(--muted); font-size: 14px; }
    footer { margin: 0; color: var(--muted); text-align: center; font-size: 14px; }
    #water { transform: translateY(122px); transition: transform .8s cubic-bezier(.2,.7,.25,1); }
    .wave { animation: wave 4s linear infinite; }
    .wave.back { animation-duration: 6s; animation-direction: reverse; }
    #spill { opacity: 0; transition: opacity .5s ease; }
    #puddle { transition: rx .6s ease, ry .6s ease; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (prefers-color-scheme: dark) {
      :root { --canvas: #191919; --surface: #20252c; --ink: #edf4fc; --muted: #b0bfce; --line: #3d4958; --blue-soft: #263f56; --track: #334253; }
      .tabs { background: var(--surface); }
      .tabs button[aria-pressed="true"] { color: #bde0ff; }
      .cup-button { background: #294158; color: #d3eaff; }
    }
    @media (max-width: 290px) { body { padding: 8px; } .card { padding: 16px; } .cup-row { gap: 12px; } .cup { width: 88px; flex-basis: 88px; } }
  </style>
</head>
<body>
  <main>
    <section class="card clock" aria-labelledby="timer-title">
      <div class="top"><h2 id="timer-title">Focus timer</h2><span class="tag">25 / 5</span></div>
      <div class="tabs" role="group" aria-label="Timer mode">
        <button id="focus-mode" aria-pressed="true">Focus · 25m</button>
        <button id="rest-mode" aria-pressed="false">Rest · 5m</button>
      </div>
      <div class="clock-display">
        <time id="clock" datetime="PT25M">25:00</time>
        <svg class="analog" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="none" stroke="#7995b1" stroke-width="2" opacity=".7" />
          <path d="M32 32V15M32 32l13 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
          <circle cx="32" cy="32" r="3" fill="#fff" />
        </svg>
      </div>
      <div class="clock-foot">Europe/London</div>
      <div class="dial" aria-hidden="true">
        <svg viewBox="0 0 164 164">
          <defs><linearGradient id="timer-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85c9fc"/><stop offset="1" stop-color="#1766b5"/></linearGradient></defs>
          <circle class="track" cx="82" cy="82" r="72" fill="none" stroke-width="6" />
          <circle id="arc" class="arc" cx="82" cy="82" r="72" fill="none" stroke-width="6" />
        </svg>
        <div class="dial-copy"><div id="digits" class="digits">25:00</div><div id="mode-label" class="mode">FOCUS</div></div>
      </div>
      <p id="status" class="status" aria-live="polite">A fresh start. You’ve got this.</p>
      <div class="controls"><button id="start" class="primary">Start focus</button><button id="reset">Reset</button></div>
    </section>
​
    <section class="card" aria-labelledby="cup-title">
      <div class="goal-head"><h2 id="cup-title">Your focus cup</h2><strong><span id="count">0</span><span> / 4</span></strong></div>
      <div class="cup-row">
        <div class="cup" id="cup-progress" role="progressbar" aria-label="Completed focus sessions" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0">
          <svg viewBox="0 0 110 130" aria-hidden="true">
            <ellipse cx="55" cy="121" rx="34" ry="4" fill="#2783de" opacity=".10" />
            <g id="spill"><ellipse id="puddle" cx="55" cy="122" rx="35" ry="2" fill="#2783de" opacity=".35" /></g>
            <defs>
              <clipPath id="cup-clip"><path d="M19 13H91L82 107Q81 114 74 114H36Q29 114 28 107Z" /></clipPath>
              <linearGradient id="water-gradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#67b8f5"/><stop offset="1" stop-color="#2783de"/></linearGradient>
            </defs>
            <path d="M19 13H91L82 107Q81 114 74 114H36Q29 114 28 107Z" fill="var(--blue-soft)" opacity=".7" />
            <g clip-path="url(#cup-clip)"><g id="water"><path class="wave back" d="M-80 0 Q-70 -5 -60 0 T-40 0 T-20 0 T0 0 T20 0 T40 0 T60 0 T80 0 T100 0 T120 0 T140 0 T160 0 T180 0 T200 0 V140 H-80Z" fill="#8dd0ff" /><path class="wave" d="M-80 4 Q-70 9 -60 4 T-40 4 T-20 4 T0 4 T20 4 T40 4 T60 4 T80 4 T100 4 T120 4 T140 4 T160 4 T180 4 T200 4 V140 H-80Z" fill="url(#water-gradient)" /></g></g>
            <path d="M19 13L28 107Q29 114 36 114H74Q81 114 82 107L91 13M19 13H91" fill="none" stroke="#6b99bf" stroke-width="3" stroke-linecap="round" />
            <path d="M79 38h6M77 62h6M75 86h6" stroke="#6b99bf" stroke-width="1.4" opacity=".6" />
          </svg>
        </div>
        <div><p id="goal-note" class="goal-note">Ready for your first drop</p><span class="hint">Finish a focus timer or log one manually.</span></div>
      </div>
      <div class="controls"><button id="add" class="cup-button primary">+ Log a session</button><button id="clear">Clear</button></div>
    </section>
    <footer>A little focus goes a long way.</footer>
  </main>
​
  <script>
    // -------------------- Focus timer --------------------
    const timer = {
      mode: 'focus',
      durations: { focus: 25 * 60, rest: 5 * 60 },
      remaining: 25 * 60,
      running: false,
      endTime: 0,
      completed: false
    };
    const $ = id => document.getElementById(id);
    const circumference = 2 * Math.PI * 72;
​
    function formatTime(seconds) {
      const sign = seconds < 0 ? '-' : '';
      const absolute = Math.abs(seconds);
      return `${sign}${String(Math.floor(absolute / 60)).padStart(2, '0')}:${String(absolute % 60).padStart(2, '0')}`;
    }
​
    function drawTimer() {
      const duration = timer.durations[timer.mode];
      const display = formatTime(timer.remaining);
      $('clock').textContent = display;
      $('clock').dateTime = `PT${Math.max(0, timer.remaining)}S`;
      $('digits').textContent = display;
      $('mode-label').textContent = timer.remaining <= 0 ? 'OVERTIME' : timer.mode.toUpperCase();
      $('arc').style.strokeDasharray = circumference;
      $('arc').style.strokeDashoffset = circumference * (1 - Math.max(0, timer.remaining) / duration);
      $('start').textContent = timer.running ? (timer.remaining <= 0 ? 'Stop overtime' : 'Pause') : timer.remaining === duration ? `Start ${timer.mode}` : 'Resume';
    }
​
    function selectMode(mode) {
      timer.mode = mode;
      timer.remaining = timer.durations[mode];
      timer.running = false;
      timer.completed = false;
      $('focus-mode').setAttribute('aria-pressed', mode === 'focus');
      $('rest-mode').setAttribute('aria-pressed', mode === 'rest');
      $('status').textContent = mode === 'focus' ? 'A fresh start. You’ve got this.' : 'Step away. Breathe. Recharge.';
      drawTimer();
    }
​
    function finishTimerOnce() {
      if (timer.remaining <= 0 && !timer.completed) {
        timer.completed = true;
        if (timer.mode === 'focus') addSession();
        $('status').textContent = 'Time is up. Overtime runs until you stop it.';
      }
    }
​
    $('focus-mode').onclick = () => selectMode('focus');
    $('rest-mode').onclick = () => selectMode('rest');
    $('reset').onclick = () => { timer.running = false; timer.completed = false; timer.remaining = timer.durations[timer.mode]; $('status').textContent = 'Reset. Ready when you are.'; drawTimer(); };
    $('start').onclick = () => {
      if (timer.running) {
        timer.remaining = Math.ceil((timer.endTime - Date.now()) / 1000);
        timer.running = false;
        finishTimerOnce();
        $('status').textContent = timer.remaining <= 0 ? 'Overtime stopped. Reset for a fresh timer.' : 'Paused. Pick up when you’re ready.';
      } else {
        timer.endTime = Date.now() + timer.remaining * 1000;
        timer.running = true;
        $('status').textContent = timer.remaining <= 0 ? 'Overtime runs until you stop it.' : timer.mode === 'focus' ? 'Just this task. Everything else can wait.' : 'A little rest goes a long way.';
      }
      drawTimer();
    };
    setInterval(() => { if (timer.running) { timer.remaining = Math.ceil((timer.endTime - Date.now()) / 1000); finishTimerOnce(); drawTimer(); } }, 250);
​
    // -------------------- Focus cup --------------------
    const storageKey = 'focus-cup-sessions-v1';
    let sessions = Number(localStorage.getItem(storageKey) || 0);
​
    function saveSessions() { localStorage.setItem(storageKey, String(sessions)); }
    function addSession() { sessions = Math.min(14, sessions + 1); saveSessions(); drawCup(); }
    function drawCup() {
      const filled = Math.min(sessions, 4);
      const overflow = Math.max(0, sessions - 4);
      const waterY = sessions === 0 ? 122 : 114 - (filled / 4) * 101;
      $('count').textContent = sessions;
      $('water').style.transform = `translateY(${waterY}px)`;
      $('spill').style.opacity = overflow ? 1 : 0;
      $('puddle').setAttribute('rx', 35 + overflow * 1.4);
      $('puddle').setAttribute('ry', 2 + overflow * .35);
      $('cup-progress').setAttribute('aria-valuenow', sessions);
      $('cup-progress').setAttribute('aria-valuetext', `${sessions} completed focus sessions`);
      $('goal-note').textContent = sessions === 0 ? 'Ready for your first drop' : sessions < 4 ? `${4 - sessions} more session${sessions === 3 ? '' : 's'} to fill the cup` : sessions === 4 ? 'Cup full. Nicely done.' : `${overflow} overflow session${overflow === 1 ? '' : 's'}`;
      $('add').disabled = sessions >= 14;
      $('add').textContent = sessions >= 14 ? 'Cup at maximum' : '+ Log a session';
      $('clear').disabled = sessions === 0;
    }
    $('add').onclick = addSession;
    $('clear').onclick = () => { sessions = 0; saveSessions(); drawCup(); };
    drawTimer();
    drawCup();
  </script>
</body>
</html>
